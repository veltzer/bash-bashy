# generate README.md, .github/dependabot.yml and src/core/version.sh from
# tera.templates/. The analyzer tracks load_lua / version_str / include
# dependencies, so a change in config/*.lua or tera.snippets/ rebuilds the
# outputs. LICENSE and .github/workflows/build.yml are not generated.
[analyzer.tera]

# no dep_inputs needed: the configs are lua and read via load_lua(path="...")
# and version_str(path="..."), which the tera analyzer discovers and
# content-tracks by itself.
[processor.tera]
src_dirs = ["tera.templates"]

# shellcheck every shell file in the repo. --external-sources is needed because
# plugins source files outside the repo (e.g. plugins/git.sh sources the system
# git completion). .shellcheckrc is a tracked dependency by default.
[processor.shellcheck]
src_dirs = ["src", "scripts"]
src_extensions = [".sh"]
args = ["--shell=bash", "--external-sources"]

# run the test suite whenever any shell file changes. test_all.sh takes no
# arguments and ignores the file list the checker passes it.
[processor.script.test_all]
command = "scripts/test_all.sh"
src_dirs = ["src", "scripts"]
src_extensions = [".sh"]
batch = true

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["doc"]
src_files = ["CLAUDE.md", "README.md"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]
